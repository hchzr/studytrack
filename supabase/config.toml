# Configuration Supabase du projet StudyTrack.
#
# `project_id` nomme le projet **local** (celui de `supabase start`) ; le projet
# distant lié, lui, est retenu dans `supabase/.temp/`, créé par `supabase link`.
project_id = "studytrack"

[functions.extract-series]
# La fonction est appelée avec la clé `anon` compilée dans l'app, qui est un JWT
# valide : `verify_jwt = true` exige donc bien une clé, et refuse un appel anonyme.
#
# Attention : la clé `anon` étant **publique**, cette vérification n'authentifie
# pas un utilisateur — elle écarte seulement les appels sans clé. La fonction
# consomme des crédits de modèle : garde un œil sur l'usage du fournisseur, et
# régénère la clé `anon` si tu constates des appels que tu n'as pas faits.
verify_jwt = true

# Le serveur MCP s'authentifie par le jeton de son adresse, pas par un JWT.
[functions.mcp]
verify_jwt = false

# Le retour OAuth des fournisseurs de tâches (Todoist, TickTick, Notion) : le
# navigateur y arrive sans JWT. La fonction ne fait qu'échanger un code à usage
# unique contre un jeton, avec le secret du fournisseur, et rouvre l'app.
[functions.oauth]
verify_jwt = false

# Rangement d'un cours Moodle par le modèle : appelé comme `extract-series`, avec
# la clé `anon` de l'app.
[functions.analyze-course]
verify_jwt = true

# Le tuteur de repli (sans Claude Code sur l'appareil) : une clé d'app exigée, plafonds dans la fonction.
[functions.tutor]
verify_jwt = true
