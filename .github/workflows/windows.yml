name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "StudyTrack/Models/**", "supabase/migrations/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "StudyTrack/Models/**", "supabase/migrations/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the sync migration in a throwaway Postgres
        run: |
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          windows/scripts/test-migration.sh

  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: studytrack-windows
          path: |
            windows/src-tauri/target/release/bundle/msi/*.msi
            windows/src-tauri/target/release/bundle/nsis/*.exe
