name: Windows

on:
  push:
    branches: [main, windows-port]
    paths: ["windows/**", "Polymestre/Models/**", "supabase/migrations/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "Polymestre/Models/**", "supabase/migrations/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the sync migration in a throwaway Postgres
        run: |
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          windows/scripts/test-migration.sh

  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: npm ci
      - run: npm test
      # Le projet Supabase (adresse + clé publique, déjà livrées dans les apps Apple) :
      # sans elles, la synchronisation et les connexions n'ont pas de serveur.
      - run: npm run tauri build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_RELAY_HOST: ${{ vars.VITE_RELAY_HOST }}
      # Le paquet du Microsoft Store (non signé : le Store signe après certification).
      # L'identité vient des variables du dépôt une fois le compte Partner Center créé.
      - name: Package MSIX
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/package-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: polymestre-windows
          path: |
            windows/src-tauri/target/release/bundle/msi/*.msi
            windows/src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: polymestre-msix
          path: |
            windows/src-tauri/target/release/bundle/msix/*.msix
            windows/src-tauri/target/release/bundle/msix/layout/
